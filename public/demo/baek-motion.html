click=()=>{st.play=!st.play;st.button.textContent=st.play?'정지':'재생'};st.slider.oninput=()=>{st.play=false;st.button.textContent='재생';st.frame=+st.slider.value;st.time=0;draw(st)};states.push(st);return st;}function draw(st){const im=normal?st.norm:st.img;if(!im.complete||!im.naturalWidth)return;const c=st.c.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,75,75);c.drawImage(im,(st.frame%st.v.cols)*75,Math.floor(st.frame/st.v.cols)*75,75,75,0,0,75,75);st.slider.value=st.frame;st.label.textContent=`${st.frame+1}/${st.v.frames}`;}function duration(st){return st.k==='pattern'?frameSec[st.frame]:st.k==='stun'?1/7.2:1/st.v.fps}function tick(now){const dt=Math.min((now-last)/1000,.15)*speed;last=now;for(const st of states){if(all&&st.play){st.time+=dt;let dur=duration(st)+(st.frame===st.v.frames-1&&!st.v.loop?.42:0);if(st.time>=dur){st.time-=dur;st.frame=(st.frame+1)%st.v.frames}}draw(st)}requestAnimationFrame(tick)}for(const [k,v]of Object.entries(ASSETS))make(k,v);document.querySelector('#allplay').onclick=e=>{all=!all;e.target.textContent=all?'전체 일시정지':'전체 재생'};document.querySelector('#reset').onclick=()=>{for(const st of states){st.frame=0;st.time=0;draw(st)}};document.querySelector('#normal').onclick=e=>{normal=!normal;e.target.classList.toggle('active',normal);e.target.textContent=normal?'컬러맵 보기':'노멀맵';for(const st of states)draw(st)};document.querySelector('#speed').onchange=e=>speed=+e.target.value;requestAnimationFrame(tick);</script></body></html>
